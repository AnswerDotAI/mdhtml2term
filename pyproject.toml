[build-system]
requires = ["maturin>=1.13,<2.0", "fastws-cli>=0.0.29"]
build-backend = "fastws.build_backend"

[project]
name = "mdhtml2term"
dynamic = ["version"]
description = "Render MDHTML Markdown as width-aware, styled terminal rows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[project.optional-dependencies]
dev = ["fastship", "pytest"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/mdhtml2term"

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "mdhtml2term._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "py/Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
