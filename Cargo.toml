[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.10"
edition = "2024"

[package]
name = "mdhtml2term"
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/AnswerDotAI/mdhtml2term"
description = "Render MDHTML Markdown as width-aware, styled terminal rows."
include = ["/src/", "/LICENSE", "/README.md"]

[lib]
test = false
doctest = false

[dependencies]
comfy-table = { version = "8", default-features = false }
html2text = { version = "0.17", features = ["css"] }
mdhtml-crate = ">=0.1.51"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2"

[dev-dependencies]
strip-ansi-escapes = "0.2"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.mdhtml2term]
incremental = true

[profile.release.package.mdhtml2term-py]
incremental = true

[profile.dist]
inherits = "release"
lto = "thin"
incremental = false
strip = true

[profile.dist.package.mdhtml2term]
incremental = false

[profile.dist.package.mdhtml2term-py]
incremental = false
